# Deploy opsional lewat GitHub Actions.
#
# Repo ini di-deploy dengan pengaturan Settings → Pages → Source: "Deploy from a
# branch" (branch main, folder /docs). GitHub membangun dan menerbitkannya
# otomatis setiap push ke main, jadi workflow ini TIDAK berjalan otomatis.
#
# Jika suatu saat Source diganti ke "GitHub Actions", ubah trigger di bawah
# menjadi `push: branches: [main]` dan workflow ini yang akan menerbitkan docs/.
name: Deploy GitHub Pages (manual)

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Validate tutorial JSON
        run: |
          set -e
          for f in docs/tutorials/index.json docs/tutorials/*/tutorial.json; do
            node -e "JSON.parse(require('fs').readFileSync('$f','utf8'))" && echo "ok  $f"
          done

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
